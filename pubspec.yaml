name: smartcall
description: "SmartCall - AI In-Call Auto-Voice Studio & Hardware Call Interceptor"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_tts: ^4.2.0
  audioplayers: ^6.1.0
  record: 5.1.2
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5

  # New Feather package: compatible with current Flutter
  feather_icon_font: ^1.0.0

  permission_handler: ^11.4.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
